name: Update visitor goal counter
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update SVG
        run: |
          set -e
          curl -fsSL "https://komarev.com/ghpvc/?username=LordLOLQDH&label=" -o /tmp/count.svg
          COUNT=$(grep -oE '>[^<]*<' /tmp/count.svg | tr -dc '0-9' | tail -c 12)
          [ -n "$COUNT" ] || exit 1
          python - "$COUNT" <<'PY'
          import math,sys
          from pathlib import Path
          count=max(0,int(sys.argv[1]))
          target=100 if count<100 else math.ceil(count/50)*50
          progress=min(count/target,1)
          c=678.58
          off=c*(1-progress)
          confetti='''<g opacity="1"><circle cx="135" cy="70" r="5" fill="#ff6a00"/><circle cx="590" cy="80" r="4" fill="#fff"/><circle cx="105" cy="230" r="4" fill="#ffb36b"/><circle cx="625" cy="235" r="5" fill="#ff6a00"/><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="3"/></g>''' if count>=100 and count%50==0 else ''
          svg=f'''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330"><defs><linearGradient id="g"><stop stop-color="#ff6a00"/><stop offset="1" stop-color="#ffb36b"/></linearGradient></defs><rect x="10" y="10" width="700" height="310" rx="28" fill="#050505" stroke="#242424"/><circle cx="360" cy="155" r="108" fill="none" stroke="#242424" stroke-width="18"/><circle cx="360" cy="155" r="108" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round" stroke-dasharray="{c}" stroke-dashoffset="{off}" transform="rotate(-90 360 155)"><animate attributeName="stroke-dashoffset" from="{c}" to="{off}" dur="1.4s" fill="freeze"/></circle><circle cx="360" cy="155" r="91" fill="#0d0d0d"/><text x="360" y="145" text-anchor="middle" fill="white" font-family="Arial" font-size="42" font-weight="800">{count}</text><text x="360" y="174" text-anchor="middle" fill="#aaa" font-family="Arial" font-size="14" letter-spacing="2">VISITORS</text><text x="360" y="298" text-anchor="middle" fill="#ff6a00" font-family="Arial" font-size="15" font-weight="700">NEXT GOAL · {target}</text>{confetti}</svg>'''
          Path("visitor-counter.svg").write_text(svg)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visitor-counter.svg
          git diff --cached --quiet || git commit -m "Update visitor goal counter"
          git push