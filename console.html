<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>adam@linuxmint — Linux Terminal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.top{height:52px;flex:0 0 52px;display:flex;align-items:center;padding:0 14px;background:#090909;border-bottom:1px solid #202020}
.brand{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}
.orange{color:#ff6a00}
.status{margin-left:auto;color:#666;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
.card{width:min(500px,100%);border:1px solid #242424;border-radius:10px;padding:26px 20px;background:#090909;text-align:center}
.card h1{margin:0 0 9px;font:700 19px ui-monospace,SFMono-Regular,Menlo,monospace}
.card p{margin:7px 0;color:#888;font-size:13px;line-height:1.45}
button{margin-top:16px;border:0;border-radius:7px;padding:11px 17px;background:#ff6a00;color:#050505;font-weight:800;font-size:14px;cursor:pointer}
.note{font-size:11px!important;color:#666!important;margin-top:12px!important}
.bottom{height:40px;flex:0 0 40px;display:flex;align-items:center;padding:0 14px;background:#090909;border-top:1px solid #202020;color:#666;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.bottom a{color:#ff6a00;text-decoration:none}
@media(max-width:650px){.status{display:none}.main{padding:8px}.card{padding:23px 16px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="orange">adam@linuxmint</span>:~$</div>
  <div class="status">LIGHT LINUX TERMINAL</div>
</div>
<div class="main">
  <div class="card">
    <h1>Linux Terminal</h1>
    <p>Diese Seite selbst lädt keine Linux-VM.</p>
    <p>Das Terminal wird erst in einem eigenen Tab gestartet.</p>
    <button id="start">Linux Terminal öffnen</button>
    <p class="note">Alpine Linux · echter Linux-Kernel · kostenlos · keine Anmeldung</p>
  </div>
</div>
<div class="bottom">
  <span>Keine VM im Hintergrund · </span>
  <a href="https://linuxontab.com/" target="_blank" rel="noopener">LinuxOnTab</a>
</div>
<script>
const terminalUrl="https://linuxontab.com/shell/?postboot="+encodeURIComponent("export PS1='adam@linuxmint:~$ '");
document.getElementById("start").addEventListener("click",()=>window.open(terminalUrl,"_blank","noopener"));
</script>
</body>
</html>
