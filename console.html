<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>adam@linuxmint — Linux Terminal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#eee;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.top{height:56px;flex:0 0 56px;display:flex;align-items:center;padding:0 16px;gap:12px;background:#090909;border-bottom:1px solid #242424}
.brand{font:700 14px ui-monospace,SFMono-Regular,Menlo,monospace}
.orange{color:#ff6a00}
.status{margin-left:auto;color:#777;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.frame{flex:1;min-height:0;padding:12px}
.shell{width:100%;height:100%;border:1px solid #252525;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 18px 55px #000}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
.bottom{height:46px;flex:0 0 46px;display:flex;align-items:center;padding:0 14px;background:#090909;border-top:1px solid #242424;color:#777;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
.bottom a{color:#ff6a00;text-decoration:none}
@media(max-width:650px){.status{display:none}.frame{padding:7px}.bottom{font-size:10px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="orange">adam@linuxmint</span>:~$</div>
  <div class="status">REAL LINUX VM · DEBIAN · BROWSER-SIDE</div>
</div>
<div class="frame">
  <div class="shell">
    <iframe src="https://webvm.io/" title="WebVM — Linux in the browser" allow="fullscreen"></iframe>
  </div>
</div>
<div class="bottom">
  <span>Browserseitige Linux-VM · keine Anmeldung für die VM erforderlich · </span>
  <a href="https://webvm.io/" target="_blank" rel="noopener">WebVM öffnen</a>
</div>
</body>
</html>
